<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume</title>
  <link rel="stylesheet" href="resume.css" />
</head>
<body>
  <div class="preview-toolbar" aria-label="简历预览工具栏">
    <button type="button" data-print title="导出 PDF">导出 PDF</button>
    <button type="button" data-zoom="out" title="缩小">−</button>
    <button type="button" data-zoom="fit" title="适应宽度">适应宽度</button>
    <span id="zoom-label">100%</span>
    <button type="button" data-zoom="in" title="放大">+</button>
    <span id="layout-warning" class="layout-warning" hidden></span>
  </div>
  <div id="print-hint" class="print-hint" hidden>
    <strong>保存 PDF 设置</strong>
    <span>纸张 A4 · 边距无 · 背景图形开启 · 页眉页脚关闭</span>
    <button type="button" data-print-confirm>继续打开打印</button>
  </div>
  <div id="app"></div>
  <script type="application/json" id="resume-data">__RESUME_DATA__</script>
  <script src="render.js"></script>
</body>
</html>
